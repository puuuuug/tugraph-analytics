[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-crawler"
version = "0.1.0"
description = "Crawl Zhihu member answers and comments with Edge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
]

[project.scripts]
zhihu-crawler = "zhihu_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["zhihu_crawler*"]
